    - 'claude'
    - 'gemini'
    - 'gemma'
    - 'llama(?:\.cpp|[- ]?\d[\w.]*)?'
    - 'ollama'
    - 'qwen'
    - '(?:opus|sonnet|haiku) \d[\w.]*'
    - 'grok'
    - 'copilot'
    - 'codex'
    - 'windsurf'
