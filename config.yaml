# 每周科技收集 Agent 的配置。改这里不用改代码。
# 没写的项用代码里的默认值：全局的见 wta/config.py，各来源的见 wta/sources/ 下对应文件的开头。
# 注意：整段删掉一个来源等于关掉它。改完请运行 python -m pytest，其中有一项专门检查这个文件。

utc_offset_hours: 8 # 日期按北京时间算

# 三个栏目，以及日报、周报里每个栏目最多放几条
sections:
  news: { title: AI 动态, emoji: 🗞️, daily: 8, weekly: 12 }
  opensource: { title: 开源圈, emoji: 🛠️, daily: 8, weekly: 12 }
  papers: { title: 前沿论文, emoji: 📄, daily: 5, weekly: 10 }

select:
  per_source_cap: 2 # 同一个来源在一个栏目里一天最多几条，避免刷屏
  caps: # 个别来源单独放宽（按页面上显示的来源名）
    Hacker News: 4
    GitHub Trending: 4
    GitHub 版本发布: 3
    Hugging Face 热门论文: 3
    Hugging Face 热门模型: 1
    魔搭 ModelScope 热门模型: 1

dedupe:
  remember_days: 120 # 登过的内容多少天内不再重复出现（长期在榜的仓库和模型靠它不反复登）
  title_similarity: 0.92

# ---------------------------------------------------------------------------
# 关键词：判断一条内容是否和 AI / 大模型有关。每一条都是正则片段，
# 两侧自动要求不是英文字母或数字（所以 AI 不会命中 said）。这份词表会过时，隔段时间看一眼。
keywords:
  exact: # 区分大小写的缩写
    - 'AIs?'
    - 'A\.I\.'
    - 'GenAI'
    - 'AIGC'
    - 'AGI'
    - 'ASI'
    - 'xAI'
    - 'LLMs?'
    - 'SLMs?'
    - 'VLMs?'
    - 'GPT-?\d[\w.\-]*'
    - 'GPTs?'
    - 'RAG'
    - 'MCP'
    - 'LoRA'
    - 'ML'
    - 'MLX'
    - 'MLOps'
    - 'TTS'
    - 'ASR'
    - 'NLP'
    - 'RLHF'
    - 'GGUF'
    - 'vLLM'
    - 'SOTA'
    - 'Cursor'
    - 'GLM'
    - 'Kimi'
  any_case: # 不区分大小写的词和短语
    # 概念
    - 'artificial intelligence'
    - 'machine[ -]learning'
    - 'deep[ -]learning'
    - 'reinforcement learning'
    - 'neural net(?:work)?s?'
    - 'language models?'
    - 'foundation models?'
    - 'world models?'
    - 'decision models?'
    - 'open[- ]weights?'
    - 'diffusion'
    - 'autoregressive'
    - 'generative'
    - 'multimodal'
    - 'chatbots?'
    - 'agentic'
    - 'agents?'
    - 'sub-?agents?'
    - 'multi-?agent'
    - '(?:frontier|local|reasoning|open|oss|open[- ]source) models?'
    - 'model weights'
    - 'fine-?tun(?:e|ed|es|ing)'
    - 'pre-?train(?:ed|ing)?'
    - 'backprop(?:agation)?'
    - 'prompts?'
    - 'prompting'
    - 'embeddings?'
    - 'vector (?:db|database|search)s?'
    - 'tokenizers?'
    - 'context windows?'
    - 'hallucinat\w+'
    - 'vibe[- ]?cod(?:e|ed|er|ers|ing)'
    - 'super ?intelligen(?:ce|t)'
    - 'text[- ]to[- ](?:speech|image|video|sql)'
    - 'speech[- ]to[- ]text'
    - 'speech recognition'
    - 'voice cloning'
    - 'computer vision'
    - 'transformers? (?:model|architecture)s?'
    - 'attention is all you need'
    - 'inference (?:engine|server|speed|cost)s?'
    # 公司和实验室
    - 'openai'
    - 'anthropic'
    - 'deepmind'
    - 'hugging ?face'
    - 'mistral'
    - 'deepseek'
    - 'cohere'
    - 'perplexity'
    - 'stability ai'
    - 'cerebras'
    - 'groq'
    - 'zhipu'
    - 'moonshot ai'
    - 'modelscope'
    # 模型和产品
