# ---------------------------------------------------------------------------
# 每周快讯：每周一把上一周的内容整理成一期（参照《CCF开源快讯》的体例），见 wta/kuaixun.py。
kuaixun:
  enabled: true
  candidates: { news: 30, opensource: 20, papers: 8 } # 从一周的日报里各取综合分最高的多少条交给大模型
  chinese_news: 12 # 中文媒体的 AI 动态另外再取几条（国内动态主要靠它们，按综合分排不进前面）
  caps: # 每个栏目最多登几条
    club: 5
    policy: 3
    domestic: 6
    overseas: 6
    opensource: 4
    papers: 3
    industry: 3
    events: 4
  club: # 俱乐部动态：开源仪表盘的周统计 + GitHub 上的新仓库和新版本
    name: 开放原子开源俱乐部
    org: hust-open-atom-club
    dashboard: 'https://osd.openatom.club'
    exclude: [weekly-tech-agent] # 不计入统计的仓库：本项目的机器人每天都提交，不算俱乐部的开发活动
    top_repos: 3 # 单独介绍最活跃的几个仓库
    release_repos: 8 # 去最活跃的几个仓库里查新版本
  policy: # 政策动向：中国政府网“最新政策”和“要闻”里标题含这些词的条目
    keywords: [人工智能, 大模型, 智能体, 算力, 开源, 软件, 数据要素, 数据产业, 公共数据, 数字经济, 数字中国,
               信息化, 网络安全, 集成电路, 芯片, 机器人, 新质生产力, 科技创新, 人才培养]
    exclude: [会见, 会谈, 通话, 考察, 出席, 贺信, 致信, 回信] # 会见、考察这类时政活动不收
  companies: # 标题以这些名字开头的，按名单分到国内动态或海外动态（大模型常把 OpenAI 分进国内）
    domestic: [DeepSeek, 深度求索, 阿里巴巴, 阿里云, 阿里, 通义, 千问, 腾讯, 混元, 百度, 文心, 字节跳动, 字节, 豆包, 火山引擎,
               华为, 智谱, 月之暗面, Kimi, MiniMax, 阶跃星辰, 小米, 京东, 美团, 快手, 可灵, 商汤, 科大讯飞, 讯飞, 蚂蚁, 百灵,
               昆仑万维, 面壁智能, 零一万物, 百川, 清华, 北大, 北京大学, 浙江大学, 上海人工智能实验室, 中国科学院, 中科院, 魔搭]
    overseas: [OpenAI, Google, 谷歌, DeepMind, Gemini, Meta, Anthropic, Claude, Microsoft, 微软, NVIDIA, 英伟达, Apple, 苹果,
               Amazon, 亚马逊, AWS, xAI, Mistral, Hugging Face, IBM, Intel, 英特尔, AMD, 斯坦福, Stanford, MIT, 伯克利,
               Cohere, Perplexity, Cursor]
  events: # 活动预告：接下来 days 天内截稿的 CCF 推荐会议（数据来自 ccfddl）
    subjects: [AI, CG, HI, MX] # 人工智能、图形学与多媒体、人机交互、交叉/综合/新兴
    ranks: [A, B]
    days: 45

# ---------------------------------------------------------------------------
# 大模型：给候选内容打分，写中文标题和一句话摘要。没有配置密钥时自动跳过，
# 日报照常生成，只是标题保持原文。密钥放在仓库的 Actions Secrets 里，不要写进这个文件。
llm:
  enabled: true
  max_requests: 30 # 每次运行最多发多少次请求（含重试）；正常一天用 10 次左右
  max_seconds: 480 # 大模型阶段总共最多用多少秒，到点就停
  max_candidates: 150 # 最多把多少条候选交给大模型打分
  review_min_score: 7 # 带“待判断”标记的内容，大模型打分达到这个数才保留
  drop_filtered: true # 被服务商的内容审核拦下的条目，直接不登
  providers: # 从上往下，用第一个配置了密钥的；它出故障时自动换下一个
    - name: 智谱
      key_env: ZHIPU_API_KEY
      base_url: 'https://open.bigmodel.cn/api/paas/v4'
      model: glm-4.7-flash
      json_mode: true
      extra: { thinking: { type: disabled } } # 关掉“思考”，否则输出长度会被思考过程占满
      interval: 3 # 两次请求之间至少隔几秒
    - name: Gemini
      key_env: GEMINI_API_KEY
      base_url: 'https://generativelanguage.googleapis.com/v1beta/openai'
      model: gemini-3.5-flash-lite
      json_mode: false
      extra: { reasoning_effort: minimal } # 3 系列关不掉“思考”，minimal 是最低一档
      interval: 7
    - name: DeepSeek
      key_env: DEEPSEEK_API_KEY
      base_url: 'https://api.deepseek.com'
      model: deepseek-flash
      json_mode: true
      extra: { thinking: { type: disabled } }
      interval: 1
    # 其他兼容 OpenAI 接口的服务：设置环境变量 LLM_API_KEY、LLM_BASE_URL、LLM_MODEL 即可，优先于上面的列表
