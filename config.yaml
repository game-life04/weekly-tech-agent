# ---------------------------------------------------------------------------
# 来源。enabled: false 就是关掉。每个来源的说明写在 wta/sources/ 下对应文件的开头。
sources:
  hackernews:
    enabled: true
    hours: 48 # 看最近多少小时的帖子
    min_points: 20 # 低于这个分数的不看
    review_points: 250 # 标题里没有关键词但分数很高的，交给大模型判断是否相关
    weight: 0.6

  qbitai:
    enabled: true
    max_items: 5
    weight: 0.55

  github_trending:
    enabled: true
    weight: 0.6

  github_new:
    enabled: true
    days: 30
    min_stars: 100
    weight: 0.5

  github_releases:
    enabled: true
    days: 3
    weight: 0.7
    repos: # 仓库名都核对过（很多项目改过名、换过组织）
      # 推理与部署
      - ggml-org/llama.cpp
      - ollama/ollama
      - vllm-project/vllm
      - sgl-project/sglang
      - mudler/LocalAI
      - xorbitsai/inference
      - BerriAI/litellm
      - open-webui/open-webui
      # 训练与微调
      - huggingface/transformers
      - huggingface/peft
      - { repo: unslothai/unsloth, tag_regex: '^v\d', trust_flag_only: true }
      - hiyouga/LlamaFactory
      # 智能体与应用框架
      - { repo: langchain-ai/langchain, tag_regex: '^langchain==\d' }
      - { repo: langchain-ai/langgraph, tag_regex: '^\d' }
      - run-llama/llama_index
      - openai/openai-agents-python
      - google/adk-python
      - langgenius/dify
      - modelcontextprotocol/modelcontextprotocol
      # 编程助手
      - anthropics/claude-code
      - { repo: openai/codex, tag_regex: '^rust-v\d' }
      - google-gemini/gemini-cli
      - anomalyco/opencode
      - OpenHands/OpenHands
      - { repo: QwenLM/qwen-code, tag_regex: '^v\d' }
      # 检索与文档
      - infiniflow/ragflow
      - microsoft/graphrag
      - { repo: milvus-io/milvus, tag_regex: '^v\d' }
      - opendatalab/MinerU
      # 评测与观测
      - open-compass/opencompass
      - EleutherAI/lm-evaluation-harness
      - langfuse/langfuse
      # 官方 SDK 与国内项目
      - openai/openai-python
      - anthropics/anthropic-sdk-python
      - PaddlePaddle/PaddleOCR
      - modelscope/modelscope
      - { repo: modelscope/FunASR, tag_regex: '^v\d' }

  hot_models:
    enabled: true
    max_items: 8
    weight: 0.5

  papers:
    enabled: true
    days: 7 # 回看几天
    categories: [cs.CL, cs.AI, cs.LG, eess.AS]
    popular: { top: 15, min_upvotes: 20, weight: 0.6 }
    gate_upvotes: 5 # 关注方向线：点赞达到这个数，或者放出了代码，才考虑
    watch_weight: 0.8
    themes: # 关注方向：标题里出现这些短语的论文（连字符和空格等价，单复数由 arXiv 处理）
      context:
        title: 长上下文与检索
        phrases: [long context, context window, context compression, prompt compression, token compression,
                  retrieval augmented, RAG, GraphRAG, agentic retrieval, reranking, long-term memory, agent memory,
                  context engineering]
      agents:
        title: 智能体
        phrases: [LLM agent, LLM agents, AI agent, AI agents, agentic, multi-agent, coding agent, coding agents,
                  computer use, tool calling, tool use, function calling, model context protocol, agent harness,
                  deep research, GUI agent, GUI agents, web agent, web agents]
      speech:
        title: 语音
        phrases: [text to speech, TTS, speech synthesis, speech recognition, ASR, voice cloning, voice conversion,
                  spoken dialogue, speech language model, speech language models, full duplex, speech to speech,
                  audio language model, audio language models, speech codec, voice agent, voice agents]
      efficiency:
        title: 高效推理
        phrases: [quantization, speculative decoding, KV cache, efficient inference, inference acceleration,
                  model compression, token pruning, on-device, LLM serving, knowledge distillation,
                  small language model, small language models, early exit]

