[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLE2502"]  # PLE2502：源码里不许出现看不见的控制字符
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文标点是有意使用的
]
